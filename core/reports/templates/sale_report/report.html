{% extends 'report.html' %}
{% load widget_tweaks %}
{% load static %}
{% block head_report %}
  <link rel="stylesheet" href="{% static 'lib/select2-4.0.13/css/select2.min.css' %}">
  <link rel="stylesheet" href="{% static 'lib/select2-4.0.13/css/select2-bootstrap4.min.css' %}">
  <script src="{% static 'lib/select2-4.0.13/js/select2.min.js' %}"></script>
  <script src="{% static 'lib/select2-4.0.13/js/i18n/es.js' %}"></script>
  <script src="{% static 'sale_report/js/report.js' %}?v=5" type="text/javascript"></script>
{% endblock %}
{% block content_report %}
  <div class="row">
    <div class="col-lg-5">
      <div class="form-group">
        <label>Rangos de fechas:</label>
        <div class="input-group mb-3">
          {{ form.date_range }}
          <div class="input-group-append">
            <button class="btn btn-success btnSearchReport" type="button"><i class="fas fa-calendar-check"></i> Buscar por rangos</button>
            <button class="btn btn-warning btnSearchAll" type="button"><i class="fas fa-calendar-check"></i> Ver todas</button>
          </div>
        </div>
      </div>
    </div>
    <div class="col-lg-4">
      <div class="form-group">
        <label>Filtrar por cliente (opcional):</label>
        <select name="client_id" id="client_id" class="form-control select2" style="width: 100%;"></select>
      </div>
    </div>
    <div class="col-lg-3">
      <div class="form-group">
        <label>Filtrar por moneda base:</label>
        <select name="base_currency_id" id="base_currency_id" class="form-control select2" style="width: 100%;">
          {% for c in base_currencies %}
            <option value="{{ c.id }}" {% if c.id == default_base_currency_id %}selected{% endif %}>{{ c.name }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
  </div>
  <div class="row">
    <div class="col-lg-12">
      <hr />
      <table class="table table-bordered" id="tblReport" width="100%">
        <thead>
          <tr>
            <th class="text-center" style="width: 10%;">Serie</th>
            <th class="text-center" style="width: 10%;">Cliente</th>
            <th class="text-center" style="width: 15%;">Fecha de registro</th>
            <th class="text-center" style="width: 15%;">Forma de pago</th>
            {# <th class="text-center" style="width: 10%;">Descuento</th> #}
            <th class="text-center" style="width: 10%;">Tipo de Cobranza</th>
            <th class="text-center" style="width: 10%;">Comentarios</th>
            <th class="text-center" style="width: 20%;">Montos</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
{% endblock %}
